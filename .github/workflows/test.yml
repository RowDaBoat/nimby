name: Test
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  test:
    strategy:
      # Report every platform, do not cancel the rest on the first failure.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_34_x86_64
          - os: ubuntu-22.04-arm
            container: quay.io/pypa/manylinux_2_34_aarch64
          - os: macos-latest
            container: null
          - os: windows-latest
            container: null
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install build dependencies (Linux container)
        if: matrix.container
        run: yum install -y git gcc make which tar gzip curl

      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6

      - name: Build Nimby
        shell: bash
        run: nim c -d:release -d:monkey src/nimby.nim

      - name: Add Nimby to PATH (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: echo "$PWD/src" >> "$GITHUB_PATH"

      - name: Add Nimby to PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "$(cygpath -w "$PWD")\src" >> "$GITHUB_PATH"

      - name: Print Nimby version
        shell: bash
        run: nimby --version

      - name: Run Nimby Unit Tests
        shell: bash
        run: nim r tests/test_parsing.nim

      - name: Test isolated Git configuration
        shell: bash
        run: nim r tests/test_gitconfig.nim

      - name: Run Nimby Functional Tests
        shell: bash
        run: nim r tests/test_commands.nim
